[project]
name = "playwright-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pytest-playwright>=0.9.0",
]

[project.scripts]
playwright-demo = "playwright_demo:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-playwright>=0.9.0",
] 


[tool.pytest.ini_options]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --browser chromium --screenshot only-on-failure --full-page-screenshot --tracing retain-on-failure --output test-results"
log_file = "logs/test_run.log"
log_file_level = "INFO"
log_file_format = "%(asctime)s | %(levelname)-7s | %(message)s"
log_file_date_format = "%Y-%m-%d %H:%M:%S"
